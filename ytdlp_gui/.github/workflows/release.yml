name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          brew install ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run macOS packaging tests
        run: bash tests/test_build_macos.sh
      - name: Build macOS archive
        run: bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ytdlp-gui-macos
          path: dist/ytdlp-gui-mac.zip
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      - name: Prepare FFmpeg
        shell: pwsh
        run: .\scripts\prepare_ffmpeg_windows.ps1
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows archive
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: ytdlp-gui-windows
          path: dist/ytdlp-gui-windows.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ytdlp-gui-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum ytdlp-gui-*.zip > SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
